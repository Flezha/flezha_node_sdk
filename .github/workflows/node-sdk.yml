name: Node SDK

# Three tiers and no controller, then the per-platform binaries a release
# publishes. Everything the core contributes is fetched from one of its
# releases and checked against that release's manifest, so nothing here needs a
# checkout of the core or a build of it.
#
# What this cannot prove is the capability vocabulary the controller owns:
# persistence, effectively-once, correction, partitioning, steps relays, liveness,
# restarts. Those are end-to-end scenarios and they run in the core's tree,
# against the commit it pins this repository at.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # The core release every tier is proven against. One tag decides the addon,
  # the fake controller and the contract set, so a change to it is one line.
  CORE_VERSION: "0.1.0"
  CORE_RELEASE: https://github.com/flezha/flezha/releases/download/v0.1.0

jobs:
  # Unit, local mode and smoke, at both ends of the support window the
  # package's `engines.node` declares.
  tiers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "26"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the three tiers
        run: scripts/ci.sh --core "$CORE_RELEASE" --version "$CORE_VERSION"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm ci --no-audit --no-fund

      - name: Formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.mjs" "scripts/**/*.mjs"

      - name: Duplication
        run: npx jscpd src

  # One addon per platform the loader's table declares. Each arm stages its own
  # and nothing else; "all five were produced" is a statement about the set and
  # is made one job below.
  #
  # The addon is built through `native/`, the wrapper crate: its one dependency
  # is the core at a git tag, so an arm needs cargo and git and no checkout of
  # the core.
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            package: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            package: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: win32-x64-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --manifest-path native/Cargo.toml --release --target ${{ matrix.target }}

      - name: Stage the addon under its platform suffix
        shell: bash
        run: |
          set -euo pipefail
          addon=""
          for name in libflz_core_ffi.so libflz_core_ffi.dylib flz_core_ffi.dll; do
            built="native/target/${{ matrix.target }}/release/$name"
            if [ -f "$built" ]; then addon="$built"; fi
          done
          test -n "$addon"
          mkdir -p "staging/${{ matrix.package }}"
          cp "$addon" "staging/${{ matrix.package }}/flz_core_ffi.node"

      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.package }}
          path: staging/
          retention-days: 14

  # The publishable set: five per-platform packages and the parent that
  # declares them. `--require-all` refuses a build missing any platform, so the
  # parent is never packed beside an optional dependency nothing produced.
  packages:
    runs-on: ubuntu-latest
    needs: [tiers, binaries]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: actions/download-artifact@v4
        with:
          pattern: node-addon-*
          merge-multiple: true
          path: staging

      - name: Write the per-platform packages
        run: node scripts/platform-package.mjs staging out --require-all

      - uses: actions/upload-artifact@v4
        with:
          name: node-packages
          path: out/
          retention-days: 14
